name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      # The face models download once per registry change, then come from the cache; the
      # tests marked `models` run whenever they are present.
      TRIPSORT_MODEL_DIR: ~/.cache/tripsort-models
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Restore the face models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/tripsort-models
          key: face-models-${{ hashFiles('src/tripsort/models/registry.py') }}

      - name: Install the project
        run: uv sync --locked --all-extras

      - name: Download the face models (checked against their pinned SHA-256)
        run: uv run tripsort models download

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type-check
        run: uv run mypy

      - name: Test
        run: uv run pytest --cov

      # The public category sample and generated dedupe and burst sets, with the real models;
      # fails when a metric drops more than 0.02 below eval/baseline.json. Once per OS.
      - name: Eval gate
        if: matrix.python-version == '3.13'
        run: uv run eval/run_eval.py gate

  fresh-install:
    name: fresh uvx run of the demo trip (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Build the wheel
        run: uv build --no-sources --wheel

      # Public-domain and CC0 images from tests/fixtures only (tools/demo_trip.py).
      - name: Build the demo trip
        run: uv run tools/demo_trip.py build "$RUNNER_TEMP/demo"

      # No model cache here: the face and CLIP models download and are checked against their
      # pinned SHA-256, as on a new computer. --python as in the README's quick start: the
      # runners' default Python may be 3.15, which onnxruntime has no wheels for yet.
      - name: Run tripsort from the wheel with uvx
        run: >-
          uvx --python 3.13 --from dist/tripsort-*.whl tripsort run
          "$RUNNER_TEMP/demo/lisa.zip" "$RUNNER_TEMP/demo/george.zip" "$RUNNER_TEMP/demo/pearl.zip"
          -o "$RUNNER_TEMP/demo/sorted" --refs "$RUNNER_TEMP/demo/refs"

      - name: Check what it sorted
        run: uv run tools/demo_trip.py check "$RUNNER_TEMP/demo/sorted" "$RUNNER_TEMP/demo"

  package:
    name: build and smoke-test the wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TRIPSORT_MODEL_DIR: ~/.cache/tripsort-models
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Restore the face models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/tripsort-models
          key: face-models-${{ hashFiles('src/tripsort/models/registry.py') }}

      - name: Build sdist and wheel
        run: uv build --no-sources

      - name: Run the installed CLI from the wheel
        run: uv run --isolated --no-project --with dist/tripsort-*.whl tripsort --version

      # A tiny zip through `tripsort run`, from the wheel alone: catches files missing from
      # the wheel (migrations, default config) that the test suite cannot see. It needs the
      # face models, which it downloads itself when the cache was empty.
      - name: Run tripsort end to end from the wheel
        run: uv run --with dist/tripsort-*.whl tools/smoke_test.py
