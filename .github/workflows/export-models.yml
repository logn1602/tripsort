name: export models

# Makes the int8 CLIP image encoder with tools/quantize.py from the fp32 image encoder of the
# models-clip-1 release (exported to ONNX by tools/export_clip.py in an earlier version of this
# workflow), and puts it on a GitHub pre-release of this repository. A model release holds
# model files only: it is never a tripsort version and never marked latest, and its tag does
# not start with "v", so release.yml does not run. tripsort pins each file's size and SHA-256
# in src/tripsort/models/registry.py. A release that exists is never changed; new files need a
# new tag.

on:
  workflow_dispatch: # run by hand; new files need a new tag (TAG below)

permissions: {}

concurrency:
  group: export-models
  cancel-in-progress: false

jobs:
  export:
    name: quantize the CLIP image encoder
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # creates the model release
    env:
      TAG: models-clip-2
      INT8: clip-vit-b-32-openai-image-int8-per-channel.onnx
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"

      - name: Stop if the release exists
        id: check
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::notice::$TAG exists and is never changed; nothing to do"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the fp32 image encoder (checked against its pinned SHA-256)
        if: steps.check.outputs.exists == 'false'
        run: |
          uv sync --locked
          mkdir out
          uv run python -c "
          import shutil
          from tripsort.models.download import ensure_models
          from tripsort.models.registry import CLIP_IMAGE_FP32 as fp32
          shutil.copy(ensure_models([fp32])[fp32.name], 'out/' + fp32.filename)
          "

      - name: Make the int8 version
        if: steps.check.outputs.exists == 'false'
        run: uv run tools/quantize.py out

      - name: Add the CLIP license and the checksums
        if: steps.check.outputs.exists == 'false'
        run: |
          curl -fsSL https://raw.githubusercontent.com/openai/CLIP/main/LICENSE -o out/LICENSE-CLIP.txt
          grep -q "MIT License" out/LICENSE-CLIP.txt
          cd out
          sha256sum "$INT8" LICENSE-CLIP.txt | tee SHA256SUMS
          ls -l

      - name: Create the model release
        if: steps.check.outputs.exists == 'false'
        run: |
          {
            echo "Model files for tripsort, not a tripsort release. tripsort downloads the ones it"
            echo "needs on first use and checks each file's size and SHA-256 before using it."
            echo
            echo "The int8 CLIP ViT-B/32 image encoder (OpenAI's weights, MIT license, see"
            echo "LICENSE-CLIP.txt), quantized by tools/quantize.py from"
            echo "clip-vit-b-32-openai-image-fp32.onnx of the models-clip-1 release: MatMul and Gemm"
            echo "weights in int8 with one scale per output channel and reduce_range, inputs"
            echo "quantized at run time; pixel_values float32 [N, 3, 224, 224] to image_embeds"
            echo "[N, 512]. The fp32 encoders and the tokenizer's vocabulary stay in models-clip-1."
            echo "quantize.json: versions, settings, and drift from fp32."
            echo
            echo "Built from $GITHUB_SHA by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "SHA-256:"
            echo
            echo '```'
            cat out/SHA256SUMS
            echo '```'
          } > notes.md
          gh release create "$TAG" \
            "out/$INT8" out/LICENSE-CLIP.txt out/SHA256SUMS out/quantize.json \
            --repo "$GITHUB_REPOSITORY" \
            --target main \
            --prerelease \
            --latest=false \
            --title "Model files: CLIP ViT-B/32 int8 image encoder, per channel (not a tripsort release)" \
            --notes-file notes.md
