# tripsort defaults. To change a value for one project, add the same table and key to
# tripsort.toml in the project folder; values there override the ones here.

[thresholds]
# Recompressed copies (such as WhatsApp copies) are found by comparing 64-bit perceptual
# hashes (pHash). The distances are initial values, tuned with eval/run_eval.py.
phash_max_distance = 6                   # at least one of the two files has no EXIF capture time
phash_max_distance_both_exif = 2         # both have EXIF capture times (which must match), same size
phash_max_distance_both_exif_resized = 4 # the same, but the pixel sizes differ (bursts never do)
copy_max_aspect_diff = 0.02             # largest relative difference in width / height for a copy
# Categories and bursts come from CLIP photo embeddings; initial values, tuned with eval/run_eval.py.
category_min_score = 0.30               # a photo's top category needs at least this share (0 to 1), else it is `other`
category_face_height = 0.03            # a face this tall (share of the photo's height) makes people the subject: `other` (0: off)
burst_similarity = 0.92                 # CLIP similarity each shot of a burst needs to the burst's first shot
burst_window_seconds = 10.0             # the most a burst's shots may come after its first, on one camera
# Rejects (blurry, dark, blown out) stay in all/ but leave people/, shots/, and categories/ for
# rejects/<reason>/. Strict on purpose, so a merely soft photo of someone stays in their folder.
# Sharpness is the Laplacian variance of a photo's sharpest tiles on a 512 px gray copy.
reject_max_sharpness = 15.0             # blurry: sharpest tiles under this (0: never)
reject_max_luma = 20.0                  # dark: mean brightness (0 to 255) under this ...
reject_min_dark_frac = 0.85             # ... and at least this share of crushed pixels
reject_min_bright_frac = 0.80           # blown out: more than this share of blown pixels (1: never)
reject_max_detail = 100.0               # dark or blown out only with less detail than this (night lights, white screenshots stay)
burst_tie_sharpness = 0.85              # burst shots this close to the sharpest one's sharpness count as tied

[people]
# Faces are found once, at ingest; every value here applies in `analyze`, so changing one
# reads no pixels. Similarities are cosine similarities of face embeddings (1 = identical).
# Tuned on the dev half of a labeled trip with eval/run_eval.py (see docs/decisions.md):
# min_cluster_size and ref_min_similarity changed, and the dev set kept the rest.
min_face_score = 0.8               # YuNet detection score a face needs to count at all
foreground_min_ratio = 0.30        # foreground: at least this share of the tallest face's height
foreground_min_height = 0.03       # and at least this share of the image height
cluster_method = "hdbscan"         # "hdbscan" or "agglomerative"
min_cluster_size = 4               # fewer faces than this never form a person
min_samples = 3                    # hdbscan: higher is more conservative
agglomerative_min_similarity = 0.4 # agglomerative: merge while the average similarity is at least this
member_min_similarity = 0.3        # a clustered face less like the person's average face than this is taken out
attach_min_similarity = 0.5        # an unclustered foreground face joins the most similar person if this close
ref_min_similarity = 0.5           # a refs/ photo names the most similar person if at least this close
background_min_similarity = 0.5    # a background face counts for a named person if at least this close
suggest_min_similarity = 0.6       # suggest merging an unnamed person into a named one this close (never automatic)
# CLIP's selfie hint, used only when a photo's lens model does not say which camera took it:
# the share (0 to 1) CLIP gives the selfie prompts against the others. 1.0 turns it off, the
# default: on the labeled trip it only added photos that were not selfies.
selfie_min_score = 1.0
selfie_prompts = ["a selfie", "a selfie taken with a phone's front camera"]
not_selfie_prompts = ["a photo of people taken by someone else", "a photo of a person taken from a distance"]

[video]
# Videos need the [video] extra (PyAV); without it they are checked for exact duplicates only.
# Frames are sampled once, at ingest, for faces and CLIP; a new sampling samples every video
# again.
frame_every_seconds = 2.0          # the first frame, then one every this many seconds
max_frames = 30                    # at most this many per clip, spread evenly over a longer one
live_photo_max_seconds = 5.0       # a video named like a still beside it is that Live Photo's motion if no longer
person_min_frames = 2              # a person is in a video when matched in at least this many frames

[categories]
# Each [categories.<name>] table is a category, sorted into categories/<name>/. A photo's
# score for a category is its average CLIP similarity to the category's prompts, and a
# softmax over every category (and `other`, which gets no folder) turns the scores into
# shares that add up to 1. Add a category with a new table, change one by giving it new
# prompts, and drop one with an empty prompts list. Photos where people are the subject
# belong in `other`.

[categories.scenery]
prompts = ["a landscape photo", "a photo of a beach", "a scenic mountain view", "a city skyline", "a sunset over the water",
           "a photo of nature", "a view of the sea", "a photo of a lake", "a panoramic view of a valley", "a landscape with no people"]

[categories.animals]
prompts = ["a photo of a dog", "a photo of a cat", "a photo of a bird", "a photo of a wild animal"]

[categories.food]
prompts = ["a photo of food on a plate", "a photo of a meal at a restaurant"]

[categories.documents]
prompts = ["a screenshot of a phone screen", "a photo of a receipt", "a photo of a ticket", "a photo of a map"]

[categories.other]
prompts = ["a photo of people", "a photo of friends posing", "a selfie", "a photo of a room", "a photo",
           "a photo of an object", "a photo of a vehicle", "a photo of furniture"]
