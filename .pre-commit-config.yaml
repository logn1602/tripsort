# Install once with `uv run pre-commit install`; run by hand with `uv run pre-commit run --all-files`.
# ruff, mypy and the lock check run through uv, so their versions come from uv.lock only.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]
        # The README's demo, drawn from public-domain and CC0 images by tools/make_demo_gif.py.
        exclude: ^docs/demo\.gif$

  - repo: local
    hooks:
      # `unsupported` is pre-commit's name for hooks that run a command already on PATH
      # (it used to be called `system`).
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --fix
        language: unsupported
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: unsupported
        types_or: [python, pyi]
      - id: mypy
        name: mypy (strict, src/)
        entry: uv run --frozen mypy
        language: unsupported
        types_or: [python, pyi]
        pass_filenames: false
      - id: uv-lock
        name: uv.lock matches pyproject.toml
        entry: uv lock --check
        language: unsupported
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
